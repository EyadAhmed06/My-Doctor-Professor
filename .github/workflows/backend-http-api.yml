name: Backend HTTP API

on:
  workflow_dispatch:
  push:
    branches:
      - agent/backend-foundation-rebuild
    paths:
      - "backend/**"
      - ".github/workflows/backend-http-api.yml"

permissions:
  contents: read

concurrency:
  group: backend-http-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-routes:
    name: 131 controller routes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: my_doctor_professor_http_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_doctor_professor_http_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: my_doctor_professor_http_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: http-test-access-secret-change-me-000000000000
      JWT_REFRESH_SECRET: http-test-refresh-secret-change-me-0000000000
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      EMAIL_VERIFICATION_TTL_SECONDS: 3600
      PASSWORD_RESET_TTL_SECONDS: 3600
      FRONTEND_URL: http://localhost:3001
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      SMTP_SECURE: "false"
      SMTP_USER: http-test
      SMTP_PASSWORD: http-test
      SMTP_FROM: no-reply@example.test
      EMAIL_OUTBOX_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      FILE_UPLOAD_PATH: /tmp/my-doctor-professor-http-uploads
      MAX_FILE_SIZE: 10485760
      ALLOW_ACCOUNT_BOOTSTRAP: "true"
      ACCOUNT_BOOTSTRAP_TOKEN: ci-bootstrap-token-000000000000000000000000
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: my_doctor_professor_http_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Apply PostgreSQL schemas
        run: |
          for schema in database/schemas/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$schema"
          done

      - name: Verify controller-to-Postman coverage
        run: npm run postman:generate

      - name: Prepare HTTP fixtures
        run: |
          mkdir -p reports "$FILE_UPLOAD_PATH" test/fixtures
          printf '%s\n' '%PDF-1.4' '1 0 obj<</Type/Catalog>>endobj' 'trailer<</Root 1 0 R>>' '%%EOF' > test/fixtures/http-api-sample.pdf

      - name: Start NestJS API
        run: |
          npm run start:prod > reports/backend.log 2>&1 &
          echo $! > reports/backend.pid

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat reports/backend.log
          exit 1

      - name: Execute every Postman request over HTTP
        run: |
          npm exec --yes --package=newman@6.2.1 -- newman run postman/My-Doctor-Professor.postman_collection.json \
            --environment postman/My-Doctor-Professor.local.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:3000/api/v1 \
            --env-var bootstrapToken="$ACCOUNT_BOOTSTRAP_TOKEN" \
            --env-var uploadFilePath="$GITHUB_WORKSPACE/backend/test/fixtures/http-api-sample.pdf" \
            --timeout-request 10000 \
            --reporters cli,json,junit \
            --reporter-json-export reports/newman.json \
            --reporter-junit-export reports/newman.xml

      - name: Verify execution report
        if: always() && hashFiles('backend/reports/newman.json') != ''
        run: node scripts/verify-newman-report.mjs

      - name: Stop NestJS API
        if: always()
        run: |
          if test -f reports/backend.pid; then
            kill "$(cat reports/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload HTTP test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-http-api-report-${{ github.run_number }}
          path: |
            backend/reports/backend.log
            backend/reports/newman.json
            backend/reports/newman.xml
            backend/reports/summary.md
          if-no-files-found: warn
          retention-days: 14
