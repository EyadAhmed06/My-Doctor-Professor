name: Browser Regression

on:
  push:
    branches:
      - agent/phase1-interactions
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcq-four-five-contract:
    name: MCQ four/five-option contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Run MCQ importer responsive choice contract
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: >-
          npx playwright test tests/browser/question-import.spec.ts
          --grep "instructor inspects a five-option PDF candidate|removing a populated fifth choice|repair missing or extra answer choices|manual explanation UI enforces 700 characters"

      - name: Run manual four/five-option authoring contract
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: >-
          npx playwright test tests/browser/four-option-mcq-flow.spec.ts
          --grep "question bank creates A-D|question bank keeps five choices as the default manual-authoring path"

      - name: Upload focused Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcq-importer-choice-contract-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  focused-assessment:
    name: Assessment regression fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build
      - name: Verify assessment persistence and closed-attempt restoration
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: >-
          npx playwright test
          tests/browser/assessment-answer-contracts.spec.ts
          tests/browser/assessment-closed-attempt-restore.spec.ts
          tests/browser/assessment-transient-retry.spec.ts
          --project=chromium-desktop --workers=2
      - name: Upload focused failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-fast-gate-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  focused-workflows:
    name: Previously failing workflows (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build
      - name: Check known regressions before full browser matrix
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: >-
          npx playwright test
          tests/browser/assessment-session.interactions.spec.ts
          tests/browser/assessment-final-200-review.spec.ts
          tests/browser/bundle-entitlements.spec.ts
          tests/browser/bundle-quiz-availability.regression.spec.ts
          tests/browser/flashcard-sync-regression.spec.ts
          tests/browser/pearl-workflow.spec.ts
          tests/browser/platform-completion.spec.ts
          tests/browser/theme-layout.audit.spec.ts
          --project=chromium-desktop --workers=4 --retries=0
      - name: Upload regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-workflow-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    needs: [focused-assessment, focused-workflows]
    name: Full browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Run full browser regression suite
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
