name: Browser Regression

on:
  push:
    branches:
      - agent/phase1-interactions
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Full browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Run full browser regression suite
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
