name: Verify MCQ Choice Removal

on:
  push:
    branches:
      - agent/verify-choice-removal

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Verify PDF inspector choice removal
        env:
          CI: true
          NEXT_PUBLIC_API_URL: /api/v1
        run: >-
          npx playwright test tests/browser/question-import.spec.ts
          --project=chromium-desktop
          --project=chromium-mobile-small
          --workers=1
          --grep "removing a populated fifth choice|repair missing or extra answer choices"
