name: Backend release gates

on:
  push:
    branches:
      - agent/backend-foundation-rebuild
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Install, build, lint, unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Verify migration timestamps and fresh-install ledger
        run: node scripts/verify-migration-ledger.mjs
      - name: Verify multi-controller route extraction
        run: node scripts/test-controller-route-extractor.mjs
      - name: Generate complete Postman contract
        run: node scripts/generate-postman-safe.mjs
      - name: Verify generated route inventory
        run: node scripts/verify-generated-route-inventory.mjs
      - run: npm audit --omit=dev --audit-level=high

  postgres:
    name: PostgreSQL bootstrap, upgrade, drift, integration, recovery
    runs-on: ubuntu-latest
    services:
      # Ubuntu 24.04 currently ships PostgreSQL client 16. Keep the CI server on the
      # same major version so pg_dump/pg_restore recovery gates exercise the product
      # instead of failing before the backup starts because of a client/server mismatch.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres-ci-password
      DB_NAME: clean_test
      JWT_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      FRONTEND_URL: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: ci-user
      SMTP_PASSWORD: ci-password
      SMTP_FROM: noreply@example.test
      EMAIL_OUTBOX_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGPASSWORD: postgres-ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create validation databases
        run: |
          createdb -h localhost -U postgres clean_test
          createdb -h localhost -U postgres upgrade_test
          createdb -h localhost -U postgres restore_test
      - name: Bootstrap current schema from zero
        run: |
          set -euo pipefail
          while IFS= read -r schema; do
            echo "Applying current ${schema}"
            psql -h localhost -U postgres -d clean_test -v ON_ERROR_STOP=1 -f "${schema}"
          done < <(find database/schemas -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Prove fresh-install migration baseline is complete
        run: DB_NAME=clean_test npm run migration:run
      - name: Require zero drift after clean bootstrap
        run: DB_NAME=clean_test npm run schema:check
      - name: Prove backup checksum and restore recovery
        run: |
          set -euo pipefail
          rm -rf /tmp/mdp-backups /tmp/mdp-uploads /tmp/mdp-restored-uploads
          mkdir -p /tmp/mdp-uploads
          printf 'managed-resource-backup-proof\n' >/tmp/mdp-uploads/backup-proof.txt
          BACKUP_DIR=/tmp/mdp-backups \
          BACKUP_RETENTION_DAYS=14 \
          FILE_UPLOAD_PATH=/tmp/mdp-uploads \
          DB_NAME=clean_test \
            npm run backup:create
          snapshot="$(find /tmp/mdp-backups -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          test -n "${snapshot}"
          BACKUP_SNAPSHOT="${snapshot}" npm run backup:verify
          BACKUP_SNAPSHOT="${snapshot}" \
          RESTORE_MODE=replace \
          FILE_UPLOAD_PATH=/tmp/mdp-restored-uploads \
          DB_NAME=restore_test \
            npm run backup:restore
          DB_NAME=restore_test npm run schema:check
          test "$(cat /tmp/mdp-restored-uploads/backup-proof.txt)" = 'managed-resource-backup-proof'
      - name: Bootstrap deployment baseline from Eyad
        run: |
          set -euo pipefail
          git fetch origin Eyad
          while IFS= read -r schema; do
            echo "Applying baseline ${schema}"
            git show "origin/Eyad:${schema}" |
              psql -h localhost -U postgres -d upgrade_test -v ON_ERROR_STOP=1
          done < <(
            git ls-tree -r --name-only origin/Eyad -- backend/database/schemas |
              grep -E '\.sql$' |
              grep -v '/11_permissions\.sql$' |
              sort
          )
      - name: Apply forward SQL and TypeORM migrations
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d upgrade_test -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          DB_NAME=upgrade_test npm run migration:run
      - name: Prove expected TypeORM migrations executed
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d upgrade_test -c \
            "SELECT id, timestamp, name FROM migrations ORDER BY timestamp, name"
          expected_count="$(psql -h localhost -U postgres -d upgrade_test -Atc "
            SELECT count(*)
            FROM migrations
            WHERE name IN (
              'HardenAssessmentWorkflow1760000000000',
              'HardenFlashcardWorkflow1770000000000',
              'HardenProgressWorkflow1780000000000',
              'HardenNotificationWorkflow1790000000000',
              'EnforceAppendOnlyAudit1800000000000',
              'AddCourseInstructorOwnership1810000000000',
              'AddResourceStorageMetadata1820000000000',
              'ReconcileDatabaseContract1830000000000',
              'RevokeLegacyRefreshSessions1840000000000',
              'AddStudentWorkspace1845000000000',
              'AddBundleAccessLayer1850000000000',
              'AddNotebookAnalyticsScheduler1860000000000',
              'AddExternalAuthIdentities1870000000000'
            )
          ")"
          test "${expected_count}" -eq 13
      - name: Apply current database permissions
        run: >-
          psql -h localhost -U postgres -d upgrade_test
          -v ON_ERROR_STOP=1
          -f database/schemas/11_permissions.sql
      - name: Require zero drift after upgrade
        run: DB_NAME=upgrade_test npm run schema:check
      - name: Prove deployment migrations are repeatable
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Reapplying ${migration}"
            psql -h localhost -U postgres -d upgrade_test -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          DB_NAME=upgrade_test npm run migration:run
          psql -h localhost -U postgres -d upgrade_test \
            -v ON_ERROR_STOP=1 -f database/schemas/11_permissions.sql
          DB_NAME=upgrade_test npm run schema:check
      - name: Run PostgreSQL integration and concurrency tests on clean bootstrap
        run: DB_NAME=clean_test npm run test:e2e -- --runInBand
      - name: Run PostgreSQL integration and concurrency tests after legacy upgrade
        run: DB_NAME=upgrade_test npm run test:e2e -- --runInBand
      - name: Run readiness load smoke
        run: |
          set -euo pipefail
          npm run build
          DB_NAME=clean_test npm run start:prod >/tmp/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "${backend_pid}" 2>/dev/null || true; cat /tmp/backend.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          LOAD_TEST_REQUESTS=500 LOAD_TEST_CONCURRENCY=20 LOAD_TEST_MAX_P95_MS=500 node scripts/load-smoke.mjs
