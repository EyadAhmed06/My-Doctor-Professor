name: Deploy AWS demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to publish the current branch
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-demo-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-south-1
  BACKEND_REPOSITORY: my-doctor-professor-demo-backend
  FRONTEND_REPOSITORY: my-doctor-professor-demo-frontend
  APP_ENV_PARAMETER: /my-doctor-professor/demo/app-env

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          test -n "$ROLE_ARN" || { echo "Missing repository variable AWS_DEPLOY_ROLE_ARN"; exit 1; }
          test -n "$PRODUCTION_ENV_FILE" || { echo "Missing repository secret PRODUCTION_ENV_FILE"; exit 1; }

      - name: Validate authentication and AI configuration
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          read_value() { printf '%s\n' "$PRODUCTION_ENV_FILE" | sed -n "s/^$1=//p" | tail -n 1; }
          GOOGLE_CLIENT_ID="$(read_value GOOGLE_CLIENT_ID)"
          SMTP_HOST="$(read_value SMTP_HOST)"
          SMTP_PORT="$(read_value SMTP_PORT)"
          SMTP_USER="$(read_value SMTP_USER)"
          SMTP_PASSWORD="$(read_value SMTP_PASSWORD)"
          SMTP_FROM="$(read_value SMTP_FROM)"
          FRONTEND_URL="$(read_value FRONTEND_URL)"
          OPENROUTER_API_KEY="$(read_value OPENROUTER_API_KEY)"
          OPENROUTER_BASE_URL="$(read_value OPENROUTER_BASE_URL)"
          OPENROUTER_MODEL="$(read_value OPENROUTER_MODEL)"

          if test -n "$GOOGLE_CLIENT_ID"; then
            [[ "$GOOGLE_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] || { echo "PRODUCTION_ENV_FILE contains an invalid GOOGLE_CLIENT_ID"; exit 1; }
            echo "Google authentication enabled."
          else
            echo "GOOGLE_CLIENT_ID is not set; deploying with Google authentication disabled."
          fi
          test -n "$SMTP_HOST" && test -n "$SMTP_PORT" && test -n "$SMTP_USER" && test -n "$SMTP_PASSWORD" && test -n "$SMTP_FROM" || { echo "SMTP configuration is incomplete"; exit 1; }
          [[ "$SMTP_HOST" != "127.0.0.1" && "$SMTP_HOST" != "localhost" && "$SMTP_HOST" != "::1" ]] || { echo "SMTP_HOST must point to the external mail provider, not the EC2 container itself"; exit 1; }
          [[ "$SMTP_PORT" =~ ^[0-9]+$ ]] || { echo "SMTP_PORT must be numeric"; exit 1; }
          [[ "$SMTP_USER$SMTP_PASSWORD$SMTP_FROM$FRONTEND_URL" != *"REPLACE"* && "$SMTP_USER$SMTP_PASSWORD$SMTP_FROM$FRONTEND_URL" != *"YOUR_"* ]] || { echo "Authentication configuration still contains placeholders"; exit 1; }
          [[ "$FRONTEND_URL" == https://* ]] || { echo "FRONTEND_URL must be the deployed HTTPS origin"; exit 1; }

          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY is required for MCQ explanation generation"; exit 1; }
          [[ "$OPENROUTER_API_KEY" != *"REPLACE"* ]] || { echo "OPENROUTER_API_KEY still contains a placeholder"; exit 1; }
          [[ "$OPENROUTER_BASE_URL" == "https://openrouter.ai/api/v1" ]] || { echo "OPENROUTER_BASE_URL must be https://openrouter.ai/api/v1"; exit 1; }
          [[ "$OPENROUTER_MODEL" == "meta/muse-spark-1.3" ]] || { echo "OPENROUTER_MODEL must be meta/muse-spark-1.3"; exit 1; }
          echo "OpenRouter MCQ enrichment configuration validated."

      - name: Validate anatomy production assets and licenses
        env:
          ANATOMY_BASE: ${{ vars.NEXT_PUBLIC_ANATOMY_ASSET_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANATOMY_BASE" || {
            echo "Missing repository variable NEXT_PUBLIC_ANATOMY_ASSET_BASE."
            echo "Publish the anatomy asset package with scripts/publish-anatomy-assets.ps1 before deploying."
            exit 1
          }
          [[ "$ANATOMY_BASE" == https://* ]] || { echo "NEXT_PUBLIC_ANATOMY_ASSET_BASE must be an HTTPS origin/prefix"; exit 1; }
          ANATOMY_BASE="${ANATOMY_BASE%/}"
          regions=(skeleton skull skull-exploded skull-base vertebrae upper-limb lower-limb hand)
          for region in "${regions[@]}"; do
            model="$ANATOMY_BASE/anatomy/$region.glb"
            poster="$ANATOMY_BASE/anatomy/$region-fallback.png"
            tmp="$(mktemp)"
            curl -fsSL --retry 3 --retry-delay 1 "$model" -o "$tmp"
            python3 - "$tmp" "$region" <<'PY'
          import json
          import struct
          import sys

          path, region = sys.argv[1], sys.argv[2]
          data = open(path, "rb").read()
          if len(data) < 20 or data[:4] != b"glTF":
              raise SystemExit(f"Invalid GLB header for {region}")
          version, declared_length = struct.unpack_from("<II", data, 4)
          json_length, json_type = struct.unpack_from("<II", data, 12)
          if version != 2 or declared_length != len(data) or json_type != 0x4E4F534A or 20 + json_length > len(data):
              raise SystemExit(f"Invalid GLB structure for {region}")
          doc = json.loads(data[20:20 + json_length].decode("utf-8").rstrip("\x00 \t\r\n"))
          notice = str(doc.get("asset", {}).get("copyright", ""))
          for required in ("Open3Dmodel", "AnatomyTOOL", "CC BY-SA 4.0"):
              if required not in notice:
                  raise SystemExit(f"{region}: missing required license metadata: {required}")
          forbidden = {"muscle tiles", "muscle tiles plain", "muscle long tendons", "tendon only"}
          for section in ("images", "textures"):
              for item in doc.get(section, []) or []:
                  name = str(item.get("name", "")).strip().casefold()
                  if name in forbidden:
                      raise SystemExit(f"{region}: non-commercial texture present: {item.get('name')}")
          PY
            rm -f "$tmp"
            curl -fsSI --retry 3 --retry-delay 1 "$poster" >/dev/null || { echo "Missing poster: $poster"; exit 1; }
          done
          curl -fsSI --retry 3 --retry-delay 1 "$ANATOMY_BASE/THIRD_PARTY_LICENSES.md" >/dev/null || {
            echo "Missing third-party license notice beside anatomy release"; exit 1;
          }
          echo "All eight anatomy models, posters, and license notices are reachable and compliant."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_ANATOMY_ASSET_BASE=${{ vars.NEXT_PUBLIC_ANATOMY_ASSET_BASE }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Store encrypted runtime configuration
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          aws ssm put-parameter \
            --name "$APP_ENV_PARAMETER" \
            --type SecureString \
            --overwrite \
            --value "$PRODUCTION_ENV_FILE"

      - name: Deploy exact commit through Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=my-doctor-professor-demo Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          test "$INSTANCE_ID" != "None" && test -n "$INSTANCE_ID" || { echo "Running demo instance not found"; exit 1; }

          BACKEND_IMAGE="${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${GITHUB_SHA}"
          FRONTEND_IMAGE="${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${GITHUB_SHA}"
          export BACKEND_IMAGE FRONTEND_IMAGE

          PARAMETERS="$(python3 - <<'PY'
          import json
          import os

          backend = os.environ['BACKEND_IMAGE']
          frontend = os.environ['FRONTEND_IMAGE']
          smtp_check = (
              "sudo docker exec mdp-backend node -e '"
              "const n=require(\"nodemailer\");"
              "const t=n.createTransport({host:process.env.SMTP_HOST,port:Number(process.env.SMTP_PORT||587),"
              "secure:process.env.SMTP_SECURE===\"true\",auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASSWORD}});"
              "t.verify().then(()=>console.log(\"SMTP transport verified\")).catch(e=>{console.error(e.message);process.exit(1)})'"
          )
          commands = [
              f"sudo sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE={backend}|' /opt/mdp/deploy.env",
              f"sudo sed -i 's|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE={frontend}|' /opt/mdp/deploy.env",
              "sudo /usr/local/bin/mdp-deploy",
              (
                  "status=$(curl -sS -o /tmp/mdp-enrich-route-check.json -w '%{http_code}' "
                  "-X POST http://127.0.0.1:3000/api/v1/questions/imports/enrich "
                  "-H 'Content-Type: application/json' -d '{}'); "
                  "test \"$status\" = 401 || test \"$status\" = 403 || "
                  "{ echo \"AI enrichment route smoke check failed with HTTP $status\"; "
                  "cat /tmp/mdp-enrich-route-check.json; exit 1; }"
              ),
              smtp_check,
              "sudo docker exec -e ALLOW_CONTENT_SEED=true -e SEED_CONTENT_OWNER_EMAIL=instructor@mydoctorprofessor.com mdp-backend npm run repair:seeded-mcqs",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query Command.CommandId --output text)"

          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
