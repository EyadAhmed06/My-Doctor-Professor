name: One-shot reviewed security sink annotation

on:
  push:
    branches:
      - agent/phase1-interactions
    paths:
      - .github/workflows/annotate-reviewed-security-sinks-once.yml

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-interactions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Annotate deliberately reviewed sinks
        run: |
          python - <<'PY'
          from pathlib import Path

          pdf = Path('backend/src/modules/questions/pdf-text-extraction.service.ts')
          text = pdf.read_text()
          old = "import {\n  execFileSync,\n  type ExecFileSyncOptionsWithStringEncoding,\n} from 'child_process';"
          new = "// security-audit-reviewed: execFileSync uses no shell, fixed argument arrays, bounded time/buffer, and server-controlled binary paths.\nimport {\n  execFileSync,\n  type ExecFileSyncOptionsWithStringEncoding,\n} from 'child_process';"
          if text.count(old) != 1:
              raise SystemExit('Unexpected child_process import shape')
          text = text.replace(old, new, 1)
          text = text.replace(
              "      const info = execFileSync(pdfinfoBinary, [pdfPath], processOptions);",
              "      // security-audit-reviewed: execFileSync avoids shell parsing; pdfPath is generated in our private temp directory.\n      const info = execFileSync(pdfinfoBinary, [pdfPath], processOptions);",
              1,
          )
          text = text.replace(
              "      execFileSync(\n        pdftotextBinary,",
              "      // security-audit-reviewed: execFileSync avoids shell parsing; every argument is a separate fixed/value argument.\n      execFileSync(\n        pdftotextBinary,",
              1,
          )
          pdf.write_text(text)

          studio = Path('backend/src/modules/tests/student-studio.controller.ts')
          text = studio.read_text()
          old = "  private async savedQuestions(actor: AuthenticatedUser, filter: StudioFilter) {\n    const data = await this.dataSource.query(`"
          new = "  private async savedQuestions(actor: AuthenticatedUser, filter: StudioFilter) {\n    // security-audit-reviewed: interpolated fragments are module constants/allowlisted predicate builders; actor/filter remain $1/$2 parameters.\n    const data = await this.dataSource.query(`"
          if text.count(old) != 1:
              raise SystemExit('Unexpected Student Studio query shape')
          studio.write_text(text.replace(old, new, 1))
          PY
      - name: Verify backend static security audit
        working-directory: backend
        run: node scripts/security-static-audit.mjs
      - name: Remove one-shot workflow and commit annotations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/annotate-reviewed-security-sinks-once.yml
          git add backend/src/modules/questions/pdf-text-extraction.service.ts backend/src/modules/tests/student-studio.controller.ts
          git commit -m 'fix: document reviewed process and SQL security sinks'
          git push origin HEAD:agent/phase1-interactions
