name: Refresh security lockfiles

on:
  push:
    branches:
      - agent/academic-locks-question-filters
    paths:
      - backend/package.json
      - frontend/package.json
      - .github/workflows/refresh-security-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-locks-question-filters
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "chore: refresh security lockfiles"
          git push origin HEAD:agent/academic-locks-question-filters
