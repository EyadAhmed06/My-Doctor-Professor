name: One-shot assessment JSX repair

on:
  push:
    branches:
      - agent/phase1-interactions
    paths:
      - .github/workflows/fix-assessment-jsx-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-interactions
      - name: Repair exact malformed pen palette expression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/connected-assessment-session.tsx')
          text = path.read_text()
          old = 'onClick={() => setPenColor(color)} />}</div></div>}{eraserMode'
          new = 'onClick={() => setPenColor(color)} />)}</div></div>}{eraserMode'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed pen palette expression, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify exact repair
        run: |
          grep -F 'onClick={() => setPenColor(color)} />)}</div></div>}{eraserMode' frontend/src/components/connected-assessment-session.tsx
      - name: Remove one-shot workflow and commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-assessment-jsx-once.yml
          git add frontend/src/components/connected-assessment-session.tsx
          git commit -m 'fix: close assessment pen palette map expression'
          git push origin HEAD:agent/phase1-interactions
