name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - agent/phase1-interactions
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-production-lockfiles:
    name: Repair production lockfiles
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/npm-audit-proxy-sharp-sourcemap-20261010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair backend lockfile
        working-directory: backend
        run: npm audit fix --package-lock-only --omit=dev
      - name: Repair frontend lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit repaired lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): update audited dependency lockfiles"
            git push
          fi
  dependency-and-build:
    name: Dependency and build gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Static security audit
        run: npm run audit:security
      - name: Verify migration ledger
        if: matrix.workspace == 'backend'
        run: npm run migration:verify-ledger
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test backend
        if: matrix.workspace == 'backend'
        run: npm test -- --runInBand

  dependency-review:
    name: Dependency review (advisory until Dependency Graph is enabled)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Explain unavailable dependency review
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo '::warning::GitHub dependency review could not run. Enable the repository Dependency Graph to restore this advisory PR-level check. Production npm audits remain blocking for frontend and backend.'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
